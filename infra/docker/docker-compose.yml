services:
    postgres:
      ports:
        - '5432:5432' 
      env_file:
        - ../../.env.dev

      image:  postgres:14-alpine
      container_name: PostgresContainer
      restart: unless-stopped
      volumes:
        - postgres_db:/var/lib/postgresql/data
      networks:
        - auth-network
      healthcheck:
        test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",]
        interval: 5s
        retries: 4
        timeout: 5s

    redis-stack:
      ports:
        - '6379:6379'
        - '8001:8001'
      env_file:
        - ../../.env.dev
      image: redis/redis-stack:latest
      container_name: RedisStackContainer
      restart: unless-stopped
      volumes:
        - redis_db:/data
      healthcheck:
        test: ["CMD","redis-cli","ping"]
        interval: 5s
        retries: 4
        timeout: 5s
      networks:
        - auth-network

    auth-grpc:
      build:
        context: ../..
        dockerfile: Dockerfile
      container_name: auth-grpc
      env_file:
         - path: "../../.env.dev"
      ports:
        - "50051:50051"
      depends_on:
        postgres:
          condition: service_healthy
        redis-stack:
          condition: service_healthy
      restart: unless-stopped
      networks:
        - auth-network
      

networks:
  auth-network:
    driver: bridge
volumes:
  postgres_db:
      driver: local # this is the default value already can be omitted if required
  redis_db: 