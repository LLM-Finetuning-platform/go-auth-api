services:
    postgres:
      ports:
        - '5432:5432' 
      env_file:
        - .env.dev

      image:  postgres:14-alpine
      container_name: PostgresContainer
      restart: always
      volumes:
        - postgres_db:/var/lib/postgresql/data
    redis-stack:
      ports:
        - '6379:6379'
        - '8001:8001'
      image: redis/redis-stack:latest
      container_name: RedisStackContainer
      

volumes:
  postgres_db:
      driver: local

  