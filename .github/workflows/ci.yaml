name: Auth Dev CI

on:  
    pull_request: 
      branches: 
         - develop
         - main
jobs:
    buf-auth-ci:
        uses: LLM-Finetuning-platform/shared-workflows/.github/workflows/buf-ci.yaml@main
    go-auth-ci:
        uses: LLM-Finetuning-platform/shared-workflows/.github/workflows/go-ci.yaml@main
  
        
    migration-check-ci:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: testdb
                    POSTGRES_USER: testuser
                    POSTGRES_PASSWORD: testpwd

                ports:
                    - 5432:5432
                
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 5s

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Setup code
              uses: actions/setup-go@v5
              with:
                go-version-file: 'go.mod'
                cache: true
            - name: Install Goose
              run: go install github.com/pressly/goose/v3/cmd/goose@latest
            - name: Test migration make commands
              env:
                ENV: ci
                GOOSE_DRIVER: postgres
                GOOSE_DBSTRING: "postgres://testuser:testpwd@localhost:5432/testdb?sslmode=disable"
              run: |
                make status
                make migration_up
                make migration_down
                make status 